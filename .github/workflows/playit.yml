name: Playit RDP Tunnel

on:
  workflow_dispatch:
    inputs:
      download_unity:
        description: "Download and extract Unity Editor"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  setup-rdp-tunnel:
    runs-on: windows-latest
    env:
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      # - name: Checkout Repository
      #   uses: actions/checkout@v4
      #   with:
      #     persist-credentials: true

      - name: Download and Install Playit
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-windows-x86_64-signed.exe" -OutFile "$env:USERPROFILE\playit.exe"
          Start-Sleep -Seconds 5

      - name: Enable Terminal Services
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0

      - name: Enable Remote Desktop Firewall
        shell: powershell
        run: |
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Enable Network Level Authentication
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Install and Enable OpenSSH Server
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object Name -like 'OpenSSH.Server*'
          if ($cap.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $cap.Name
          }
          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd

          # Use PowerShell as the default SSH shell
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell `
            -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -PropertyType String -Force

          if (-not (Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -DisplayName "OpenSSH Server (sshd)" `
              -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
          }

      - name: Configure SSH Public Key (optional)
        if: ${{ env.SSH_PUBLIC_KEY != '' }}
        shell: powershell
        run: |
          # runneradmin is an administrator, so Windows uses this file
          $file = "C:\ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $file -Value $env:SSH_PUBLIC_KEY
          icacls $file /inheritance:r /grant "SYSTEM:F" /grant "Administrators:F"
          Restart-Service sshd

      - name: Set runneradmin Password
        shell: powershell
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "p@ssw0rd!" -Force)

      - name: Download Unity Editor zip from R2
        if: ${{ inputs.download_unity }}
        shell: powershell
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          aws s3 cp s3://unity/editor.zip "$env:RUNNER_TEMP\editor.zip" --endpoint-url ${{ secrets.R2_ENDPOINT }}

      - name: Extract Unity Editor to Hub folder
        if: ${{ inputs.download_unity }}
        shell: powershell
        run: |
          7z x "$env:RUNNER_TEMP\editor.zip" -o"C:\Program Files\Unity\Hub\Editor"

      - name: Clean up temp zip
        if: ${{ always() && inputs.download_unity }}
        shell: powershell
        run: |
          Remove-Item "$env:RUNNER_TEMP\editor.zip" -Force -ErrorAction SilentlyContinue

      # - name: Install MS Office (Word and Excel)
      #   shell: powershell
      #   run: |
      #     choco install office365proplus -y --no-progress
      #   continue-on-error: true

      - name: Start Playit and Set Up RDP Tunnel
        shell: powershell
        env:
          PLAYIT_AUTH_KEY: ${{ secrets.DEAR_FIN }}
        run: |
          Start-Process -FilePath "$env:USERPROFILE\playit.exe" -ArgumentList "--secret $env:PLAYIT_AUTH_KEY" -NoNewWindow -Wait
          Start-Process -FilePath "$env:USERPROFILE\playit.exe" -NoNewWindow

      - name: Keep the GitHub Action Runner Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 11800
